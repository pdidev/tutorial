# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  view: true
  concretizer:
    unify: true

  # add package specs to the `specs` list
  specs:
  - cmake
  - pdi~fortran
  - pdiplugin-decl-hdf5
  - pdiplugin-mpi
  - pdiplugin-pycall
  - pdiplugin-user-code
  - pdiplugin-trace
  - kokkos
  - python
  - py-dask
  - py-distributed
  - py-bokeh
  - py-matplotlib


  mirrors:
    numpex-buildcache:
      url: oci://ghcr.io/benoitmartin88/spack-numpex-stack
      binary: true
      signed: false

  packages:
    all:
      require:
        - target=x86_64
