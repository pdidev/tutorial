# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  - compilers: [gcc@11.5.0]
  #- compilers: [gcc@15.1.0]
  - packages:
    - cmake
    - pdi
    - pdiplugin-decl-hdf5
    - pdiplugin-mpi
    - pdiplugin-pycall
    - pdiplugin-user-code
    - pdiplugin-trace
    - python
    - py-numpy
    - py-matplotlib
    #- py-dask
    #- py-distributed
    #- py-bokeh
  specs:
  - $compilers
  - matrix:
    - [$packages]
    - [$%compilers]

  view: true
  concretizer:
    unify: when_possible
  mirrors:
    develop: https://binaries.spack.io/develop
